<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Licencias | Retro Juegos Argentina</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">RJ</div>
        <div>
          <p class="eyebrow">RETRO JUEGOS ARGENTINA</p>
          <h1>Administrar licencias</h1>
        </div>
      </header>

      <section id="login-panel" class="card">
        <h2>Ingresar</h2>
        <p class="muted">Acceso reservado a administradores autorizados.</p>
        <form id="login-form">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Iniciar sesión</button>
        </form>
      </section>

      <section id="admin-panel" class="card" hidden>
        <div class="panel-heading">
          <div>
            <h2>Nueva clave</h2>
            <p class="muted">Cada clave puede activarse una sola vez.</p>
          </div>
          <button id="logout-button" class="button-secondary" type="button">Cerrar sesión</button>
        </div>
        <button id="create-button" type="button">Generar clave</button>
        <div id="generated-key" class="generated-key" hidden>
          <p>Guarda esta clave ahora. No volverá a mostrarse.</p>
          <code id="key-value"></code>
          <button id="copy-button" class="button-secondary" type="button">Copiar clave</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="footnote">Las claves se almacenan como hashes; la clave completa solo se muestra al generarla.</p>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
